name: Deploy web flasher

# Manual trigger only — never runs on push or pull request.
on:
  workflow_dispatch:

# Least privilege needed to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two Pages deployments at once.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'sdkconfig.defaults') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build firmware (ESP32-C3, ESP-IDF)
        run: |
          # Regenerate sdkconfig from sdkconfig.defaults so the build is
          # reproducible: PlatformIO does NOT re-apply defaults while a generated
          # sdkconfig.<env> already exists, so delete it first.
          rm -f sdkconfig.beacon_c3_espidf
          pio run -e beacon_c3_espidf

      - name: Assemble site
        run: |
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp webflash/index.html webflash/manifest.json "$site/"
          cp .pio/build/beacon_c3_espidf/bootloader.bin "$site/"
          cp .pio/build/beacon_c3_espidf/partitions.bin "$site/"
          cp .pio/build/beacon_c3_espidf/firmware.bin   "$site/"
          echo "SITE_DIR=$site" >> "$GITHUB_ENV"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.SITE_DIR }}

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
