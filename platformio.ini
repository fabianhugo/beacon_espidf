[platformio]
default_envs = beacon_s3

; NimBLE-Arduino 2.x requires Arduino-ESP32 3.x (IDF v5).
; espressif32 platform 6.x bundles Arduino-ESP32 3.x and is installed
; independently from the WLED project's older platform version.

[env:beacon_s3]
platform               = espressif32@^6.9.0
board                  = lolin_s3_mini
board_upload.flash_size = 4MB
board_build.partitions = default.csv
board_build.flash_mode = qio
board_build.f_flash    = 80000000L
framework     = arduino
monitor_speed = 115200
lib_deps      =
    h2zero/NimBLE-Arduino@^2.2.3
    fastled/FastLED@^3.9.0
build_flags   =
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM

[env:beacon_c3]
platform      = espressif32@^6.9.0
board         = seeed_xiao_esp32c3   ;; board def provides ARDUINO_USB_MODE=1 (HWCDC) so Serial is defined
framework     = arduino
monitor_speed = 115200
lib_deps      =
    h2zero/NimBLE-Arduino@^2.2.3
    fastled/FastLED@^3.9.0
build_flags   =
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=10          ;; external WS2812B data pin on the Xiao C3
    -DNUM_LEDS=10
    -DBOOT_BUTTON_PIN=9   ;; Xiao C3 BOOT button is GPIO9

; SPIKE: same as beacon_c3 but with Arduino compiled as an ESP-IDF component so
; sdkconfig.defaults (CONFIG_PM_ENABLE etc.) actually takes effect. See
; sdkconfig.defaults at project root.
[env:beacon_c3_espidf]
platform      = espressif32@^6.9.0
board         = seeed_xiao_esp32c3
framework     = espidf, arduino
monitor_speed = 115200
lib_deps      =
    h2zero/NimBLE-Arduino@^2.2.3
    fastled/FastLED@^3.9.0
build_flags   =
    -DCONFIG_BT_NIMBLE_EXT_ADV=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DLED_PIN=10
    -DNUM_LEDS=10
    -DBOOT_BUTTON_PIN=9
    ; IDF's project-wide -Werror=all catches warnings inside vendored libs
    ; (NimBLE-Arduino, upstream code we don't control) that plain Arduino/SCons
    ; builds don't enforce. Silence just the categories that fire there.
    -Wno-error=int-in-bool-context
    -Wno-error=return-type
    -Wno-error=unused-but-set-parameter
    -Wno-error=unused-but-set-variable
    -Wno-error=unused-variable
